[pytest]
# The test modules import `src.coder.*`, so the backend/ directory must be on
# sys.path. Without this, pytest only puts backend/tests/ on sys.path and
# collection fails with ModuleNotFoundError: No module named 'src'.
# Relative to rootdir, so both `cd backend && pytest` and `pytest backend/tests`
# from the repo root work.
pythonpath = .
testpaths = tests
